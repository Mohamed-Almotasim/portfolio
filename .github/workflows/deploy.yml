name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Project pages live under /<repo>/. With a custom domain use "/".
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      # Path URLs: GitHub Pages serves 404.html for unknown paths, so deep
      # links and refreshes still boot the app.
      - run: cp build/web/index.html build/web/404.html
            # Every known route also gets its own index.html, so direct visits and
      # crawlers get a 200 instead of the 404 page. Slugs come from content.
      - name: Write a page per route
        run: |
          cd build/web
          routes="work playground about contact"
          for s in $(grep -oP "slug: '\K[^']+" ../../lib/core/content/portfolio_content.dart); do routes="$routes work/$s"; done
          for s in $(grep -oP "slug: '\K[^']+" ../../lib/features/playground/specimen_info.dart); do routes="$routes playground/$s"; done
          for r in $routes; do mkdir -p "$r"; cp index.html "$r/index.html"; done
          echo "Pages: $routes"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
