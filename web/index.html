<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. Must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>Mohamed Almotasim Salih — Flutter Developer</title>
  <meta name="description" content="Flutter developer building polished mobile and web apps. Case studies, live demos, and the code behind them.">
  <meta name="theme-color" content="#0E1A22" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <!-- GitHub Pages address; change all three URLs if you add a custom domain. -->
  <link rel="canonical" href="https://mohamed-almotasim.github.io/portfolio/">

  <!-- Open Graph / Twitter. Previews need absolute image URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mohamed-almotasim.github.io/portfolio/">
  <meta property="og:title" content="Mohamed Almotasim Salih — Flutter Developer">
  <meta property="og:description" content="Flutter developer building polished mobile and web apps.">
  <meta property="og:image" content="https://mohamed-almotasim.github.io/portfolio/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mohamed Almotasim Salih — Flutter Developer">
  <meta name="twitter:description" content="Flutter developer building polished mobile and web apps.">
  <meta name="twitter:image" content="https://mohamed-almotasim.github.io/portfolio/og-image.png">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Startup: the first frame waits on these (main.dart preloadFonts), but
       Dart would only request them after main.dart.js loads. Fetch them now,
       in parallel. Keep in sync with assets/google_fonts and preloadFonts. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="assets/AssetManifest.bin.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/google_fonts/IBMPlexSans-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/google_fonts/IBMPlexSans-SemiBold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/google_fonts/IBMPlexMono-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/google_fonts/IBMPlexMono-Medium.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/google_fonts/ArchivoExpanded-SemiBold.ttf" as="fetch" crossorigin>

  <style>
    /* Branded splash shown until Flutter paints its first frame. */
    html, body { margin: 0; height: 100%; background: #F4F1EA; }
    #splash {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #F4F1EA; transition: opacity 200ms linear;
    }
    #splash .mark {
      width: 56px; height: 56px; border-radius: 0; background: #EB4700;
      display: grid; place-items: center; color: #16150F;
      font: 700 22px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.02em;
      animation: pulse 1.2s steps(2, jump-none) infinite;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    @keyframes pulse { 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { #splash .mark { animation: none; } }
    @media (prefers-color-scheme: dark) { html, body, #splash { background: #0E1A22; } #splash .mark { background: #FF6A2B; color: #0E1A22; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="mark">MA</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 220);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
