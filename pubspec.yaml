name: portfolio
description: "Flutter web portfolio: UI showcase, live app demos and case studies."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.1.2
  google_fonts: ^9.0.0
  http: 1.6.0
  url_launcher: 6.3.3
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/
    # Demo sources: developer mode shows the real code (source_snippet.dart).
    - lib/features/ui_showcase/demos/
    - lib/features/ui_showcase/widgets/analytics_dashboard_demo.dart
    - lib/shared/widgets/faq_accordion.dart
